<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Face Analysis Web</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='web/styles.css') }}">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>Face Analysis</h1>
          <span class="subtitle">Age, gender, and emotion</span>
        </div>
        <div class="status-pill" id="modelStatus">Loading</div>
      </header>

      <main class="workspace">
        <section class="stage-panel" aria-label="Preview">
          <div class="stage" id="stage">
            <video id="cameraVideo" autoplay muted playsinline></video>
            <img id="resultImage" alt="Annotated result">
            <div class="stage-overlay" id="overlayLayer" aria-hidden="true"></div>
            <div class="stage-empty" id="stageEmpty">Camera off</div>
          </div>
          <div class="metrics">
            <div>
              <span class="metric-label">Faces</span>
              <strong id="faceCount">0</strong>
            </div>
            <div>
              <span class="metric-label">Latency</span>
              <strong id="latency">-- ms</strong>
            </div>
            <div>
              <span class="metric-label">Detector</span>
              <strong id="activeDetector">YOLO</strong>
            </div>
          </div>
        </section>

        <aside class="control-panel" aria-label="Controls">
          <div class="control-group">
            <label for="detectorSelect">Detector</label>
            <select id="detectorSelect">
              <option value="yolo" selected>YOLO</option>
              <option value="auto">Auto</option>
              <option value="haar">Haar</option>
            </select>
          </div>

          <div class="control-group">
            <span class="field-label">Mode</span>
            <div class="segmented" role="group" aria-label="Mode">
              <button class="segment active" data-quality="fast" type="button">Fast</button>
              <button class="segment" data-quality="quality" type="button">Quality</button>
            </div>
          </div>

          <div class="control-group">
            <label for="intervalRange">Interval</label>
            <div class="range-row">
              <input id="intervalRange" type="range" min="300" max="1600" step="100" value="700">
              <span id="intervalValue">700 ms</span>
            </div>
          </div>

          <div class="button-row">
            <button id="startCamera" class="primary" type="button">Start Camera</button>
            <button id="snapshotCamera" type="button" disabled>Snapshot</button>
            <button id="stopCamera" class="danger" type="button" disabled>Stop</button>
          </div>

          <div class="upload-row">
            <input id="imageInput" type="file" accept="image/*">
            <button id="analyzeImage" type="button">Analyze Image</button>
            <button id="downloadResult" type="button" disabled>Download Result</button>
          </div>

          <section class="results-panel" aria-label="Results">
            <div class="results-header">
              <h2>Results</h2>
              <span id="resultState">Idle</span>
            </div>
            <div id="predictionList" class="prediction-list"></div>
          </section>

          <section class="history-panel" aria-label="History">
            <div class="results-header">
              <h2>History</h2>
              <button id="clearHistory" class="small-button" type="button">Clear</button>
            </div>
            <div id="historyList" class="history-list"></div>
          </section>
        </aside>
      </main>
    </div>

    <canvas id="captureCanvas" hidden></canvas>
    <script src="{{ url_for('static', filename='web/app.js') }}"></script>
  </body>
</html>
